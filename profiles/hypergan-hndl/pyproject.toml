[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "moss-image-sliders-hndl"
version = "0.4.0.dev0"
description = "Isolated MOSS native adapter GAN with the shared HyperGAN/HNDL field critic"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = [
  "torch==2.9.1", "diffusers==0.38.0", "transformers==5.3.0",
  "accelerate==1.10.1", "safetensors==0.8.0", "Pillow>=13.0.0",
  "huggingface-hub==1.16.0", "particlegan==0.9.5", "hndl==0.10.0",
  "particle-sliders-core[serialization,hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@3dd672a7f9b8c169daef90fd63e4bb42b9ddc423#subdirectory=packages/particle-sliders-core",
]

[project.scripts]
moss-hndl = "moss_sliders.native_hndl:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/moss_sliders"]
